name: Build FreeDom Launcher

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FreeDomLauncher.sln

      - name: Build
        run: dotnet build FreeDomLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test FreeDomLauncher.Tests/FreeDomLauncher.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish (win-x64, single file, self-contained)
        run: >
          dotnet publish FreeDomLauncher.App/FreeDomLauncher.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath FreeDomLauncher-1.0.0-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FreeDomLauncher-1.0.0-win-x64
          path: FreeDomLauncher-1.0.0-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FreeDomLauncher-1.0.0-win-x64.zip
